<!DOCTYPE html>
<head>
    <title>Cars Array</title>
</head>
<body>
    <script>
        let cars = ["Toyota", "Honda", "Mazda", "Mitsubishi", "Tesla", "Lexus"];
            console.log("first car: " + cars[0]);
            console.log("last car: " + cars[cars.length -  1]);
            cars.push("Mercedes-Benz");
            console.log("updated cars array: " + cars);
        document.write("<h1>Cars Array</h1>");
            for (let i = 0; i < cars.length; i++) {
        console.log(cars[i]);
    document.write(cars[i] + "<br>");
    }
    </script>
</body>
</html>
